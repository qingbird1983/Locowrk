name: CI

# 三条线各一个作业（审计报告 H1：旧 CI 只有根 workspace 一条线，
# desktop 与前端**完全不编译、不 lint、不测试**——项目自报的 desktop /
# vue-tsc / stylelint 门禁只活在人工纪律里）。
#   kernel   = 根 workspace（crates + plugins-src）
#   desktop  = desktop/src-tauri（被 Cargo.toml exclude 在根 workspace 外，
#              必须显式 --manifest-path；Windows runner 贴合实际资产：
#              pdfium.dll / WebView2 / Credential Manager 都是 Windows 面）
#   hygiene  = 机械闸群，纯脚本秒级，谁破了当场知道是哪一条。
#              ⚠ 这里刻意**不写"几道"、也不列举闸名**：闸的只数与名字都会随批增删，
#              写死在头注里必然漂（历批第 116 条「同一读数两处手写一遍」的同族——
#              本文件此前的那份列举就已经漏了预留对账与文档预算两道）。
#              现役清单以下面的 `name:` 步骤与 AGENTS「每批收尾门禁」那段为准。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format (workspace root)
        run: cargo fmt --all --check
      - name: Clippy (workspace root)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (workspace root)
        run: cargo test --workspace
      - name: Unused dependencies (advisory)
        # cargo-machete 逐 Cargo.toml 判「声明了但源码零引用」——审计里 3 处
        # 这类问题全靠人工读出来。首版标 advisory（continue-on-error）：
        # 本机未能预跑该工具在 CI 上的行为，跑通一绿后再摘掉这行改成硬门。
        continue-on-error: true
        run: |
          cargo install cargo-machete --locked
          cargo machete

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # ⚠ Q11 把这一作业的 node 从 20 抬到 24、pnpm 从 9 抬到 11，**不是顺手升版本**：
      # 实测 `npm view vitest@5.0.4 engines` = `^22.12.0 || ^24.0.0 || >=26.0.0` ⇒
      # 前端测试面在 node 20 上根本跑不起来；`24` 又是本机实测档位（v24.14.0），
      # 类型与运行同档（happy-dom 要 >=20 ✓、jsdom 30 要 >=24.15 ⇒ 本仓因此选 happy-dom）。
      # pnpm 取 11 = 与本机 `pnpm -v` 同档，避免 lockfileVersion 9.0 由不同大版本读写。
      # hygiene 作业留在 node 20：它只跑 scripts/*.mjs 与 bash，不含 vitest。
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Frontend build (generate_context! 需要 dist/)
        run: pnpm -C desktop install --frozen-lockfile && pnpm -C desktop run build
      - name: Style lint (design tokens + template rules)
        run: pnpm -C desktop run lint:style
      - name: Frontend tests (Q11 运行面：IPC 替身 / store 行语义 / 组件双档)
        run: pnpm -C desktop run test:run
      - name: Format (desktop)
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check
      - name: Clippy (desktop)
        run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Tests (desktop)
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # 拆分登记表复验要从历史 blob 取原文（`git show <ref>:<path>`），浅克隆取不到 ⇒ 全量拉历史
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: File length vs baseline (report + 不许新增)
        run: bash scripts/check_length.sh
      - name: i18n 双向闭合（zh/en 键集相等 + 引用键必存在）
        run: node scripts/check-i18n.mjs
      - name: Tauri 命令三向闭合（定义 = 注册表 = 前端引用）
        run: node scripts/check-commands.mjs
      - name: 中间件接线（未接线必须显式白名单）
        run: node scripts/check-middleware-wiring.mjs
      - name: 事件通道对账（第八道结构闸：常量 / channel() / CHANNELS / stores case 四面）
        run: node scripts/check-channels.mjs
      - name: 拆分形状（第五道结构闸：mod 闭合 / 用例不混住 / 私有项跨簇 / 簇名撞名）
        run: node scripts/check-split-equivalence.mjs
      - name: 拆分登记表复验（每刀入库的 ledger 都要能从历史原文重放，--no-cargo）
        run: |
          shopt -s nullglob
          for f in scripts/split-ledger/*.json; do
            echo "── $f"
            node scripts/check-split-equivalence.mjs --split --ledger "$f" --no-cargo
          done
