name: CI

# 三条线各一个作业（审计报告 H1：旧 CI 只有根 workspace 一条线，
# desktop 与前端**完全不编译、不 lint、不测试**——项目自报的 desktop /
# vue-tsc / stylelint 门禁只活在人工纪律里）。
#   kernel   = 根 workspace（crates + plugins-src），跑测试前先构建市场夹具（二进制不入库）
#   desktop  = 前端三件事（构建含类型检查 / 形态 / vitest）。2026-10-17 起不再在云端编译
#              `desktop/src-tauri` 的 Rust——那部分由本机 `make check` 管，见下面作业注释
#   hygiene  = 机械闸群，纯脚本秒级。**它只调 `sh scripts/tasks.sh gates`**：
#              闸的清单住在 scripts/tasks.sh 一处，这个文件不再逐条抄写——
#              抄一次就多一个会漂的副本（v2.209 实测：手抄的那份漏了两道闸，
#              而本仓库从未 push ⇒ 漏了也没人知道）。
# 2026-10-17 首次推送后两次真实运行各暴一类"本机有、检出面没有"的前置，都在这个文件外面解决：
#   hygiene 红 18 条 = 文档闸把不入库的 ⊘ 层当"必须在场"（改成"缺席且被排除 ⇒ 跳过并打印条数"）；
#   kernel  红 7 条 = 市场夹具二进制不入库而 CI 没构建它（下面多的一步 build_market.sh）。
# 动本文件经用户 2026-10-17 明确批准（AGENTS.md §5 把它列为禁区）。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format (workspace root)
        run: cargo fmt --all --check
      - name: Clippy (workspace root)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Stage market fixtures (binaries are not committed by design)
        # plugin-service 的市场安装 / 版本切换 / 回退那批用例读 market/tool-shout/<ver>/ 下的
        # 插件二进制，而二进制按 .gitignore 不入库 ⇒ 检出面里没有。本机一直是绿的，因为那些产物
        # 早先就构建过留在本地；2026-10-17 云端首次跑 kernel 作业，7 条红全在 `NotFound`。
        # 脚本本身跨平台（find_artifact 认 dll / .so / .dylib 三种产物名）。
        # 若将来还有用例依赖 plugins/ 侧暂存产物，同法再加 build_plugins.sh —— 别把测试改成跳过。
        run: bash scripts/build_market.sh
      - name: Tests (workspace root)
        run: cargo test --workspace
      - name: Unused dependencies (advisory)
        # cargo-machete 逐 Cargo.toml 判「声明了但源码零引用」——审计里 3 处
        # 这类问题全靠人工读出来。首版标 advisory（continue-on-error）：
        # 本机未能预跑该工具在 CI 上的行为，跑通一绿后再摘掉这行改成硬门。
        continue-on-error: true
        run: |
          cargo install cargo-machete --locked
          cargo machete

  desktop:
    # 2026-10-17 瘦身（用户嫌等太久，实测上一轮：hygiene 15s / kernel 244s / 本作业 564s，
    # 三个作业并行 ⇒ 每次等的基本就是它，而且它跑在 Windows 机器上还要额外排队）。
    # 云端只留**前端三件事**：装依赖+构建（含 vue-tsc 类型检查）/ 界面形态检查 / 前端用例。
    # 拿掉的是 `desktop/src-tauri` 的 fmt + clippy + test —— 那三步要在 Windows 上冷编译
    # 整个 Tauri 依赖树，占掉这个作业绝大部分时间，而它们本来就在本机 `make check` 里每次都跑。
    # 留下的代价（如实）：云端不再证明"桌面端 Rust 能编译"；哪天本机 make check 被跳过，
    # 这一面就没有第二双眼睛。真出问题时最坏是本机发现，不会伤数据。
    # 因此 runner 从 windows-latest 换成 ubuntu-latest：前端三件事不需要 WebView2 / pdfium 这些
    # Windows 资产。⚠ 若 ubuntu 上 `pnpm install --frozen-lockfile` 因平台可选依赖过不去，
    # 回退方向是**换回 windows runner 但保持这三步**（省 Rust 编译才是大头），别顺手把 Rust 三步加回来。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ⚠ Q11 把这一作业的 node 从 20 抬到 24、pnpm 从 9 抬到 11，**不是顺手升版本**：
      # 实测 `npm view vitest@5.0.4 engines` = `^22.12.0 || ^24.0.0 || >=26.0.0` ⇒
      # 前端测试面在 node 20 上根本跑不起来；`24` 又是本机实测档位（v24.14.0），
      # 类型与运行同档（happy-dom 要 >=20 ✓、jsdom 30 要 >=24.15 ⇒ 本仓因此选 happy-dom）。
      # pnpm 取 11 = 与本机 `pnpm -v` 同档，避免 lockfileVersion 9.0 由不同大版本读写。
      # hygiene 作业留在 node 20：它只跑 scripts/*.mjs 与 bash，不含 vitest。
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Frontend build (vue-tsc 类型检查 + 打包)
        run: pnpm -C desktop install --frozen-lockfile && pnpm -C desktop run build
      - name: Style lint (design tokens + template rules)
        run: pnpm -C desktop run lint:style
      - name: Frontend tests (Q11 运行面：IPC 替身 / store 行语义 / 组件双档)
        run: pnpm -C desktop run test:run

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # ★ 闸的清单只有一个出处：这里**不再逐条手抄**。
      #   v2.209 之前的这个作业把八道闸抄成了六条 `run:`，加闸时漏掉了「预留对账」与
      #   「文档规则」两道——而且因为本仓库 main 从未 push（298 个提交、零个 remote），
      #   CI 一次也没跑过，漏得无人知晓，连"拆分登记表重放"这条**必红**的步骤（9 份里
      #   8 份已红）也一直躺在这里。手抄清单的真正问题不是漏，是没人会被它提醒。
      #   现在新增/删除闸只改 scripts/tasks.sh 的 t_gates，这里跟着它一起变。
      - name: 全部结构闸（清单 = scripts/tasks.sh 的 t_gates）
        run: sh scripts/tasks.sh gates
