<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Locowrk Phase 4 spike</title>
  <style>
    html, body { margin: 0; height: 100%; font: 14px system-ui; }
    body { display: grid; place-items: center; background: #f6f6f4; color: #222; }
    #log { font-family: ui-monospace, monospace; font-size: 12px; white-space: pre; }
  </style>
</head>
<body>
  <div id="log">waiting for Go</div>
  <script>
    const log = (s) => { document.getElementById("log").textContent = s; };
    window.addEventListener("DOMContentLoaded", () => {
      mygo.call("Probe.Report", { stage: "page", detail: location.href })
        .then((ack) => log("call ok: " + ack))
        .catch((err) => log("call failed: " + err));
    });
    mygo.on("phase4-tick", (payload) => {
      log("event ok: " + payload);
      mygo.call("Probe.Report", { stage: "event", detail: payload });
    });
  </script>
</body>
</html>
