[package]
name = "tool-fs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

# 插件产物是动态库（Windows: tool_fs.dll，见 plugins/README.md）。
[lib]
crate-type = ["cdylib"]

# 只读文件工具纯用 std，零第三方依赖；serde_json / semver 经 plugin-api re-export。
[dependencies]
plugin-api = { workspace = true }

# manifest 版本号来自编译期环境变量 LOCOWRK_PLUGIN_VERSION
# （版本真源 = scripts/build_plugins.sh 的 stage 调用清单，此处不写死版本号）。
