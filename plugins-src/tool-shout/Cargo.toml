[package]
name = "tool-shout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

# 插件产物是动态库（Windows: tool_shout.dll）。
[lib]
crate-type = ["cdylib"]

# 插件只依赖冻结契约层：serde_json / semver 经 plugin-api re-export。
[dependencies]
plugin-api = { workspace = true }

# manifest 版本号来自编译期环境变量 LOCOWRK_PLUGIN_VERSION
# （版本真源 = scripts/build_market.sh 的 stage 调用清单，暂存进 market/）。
