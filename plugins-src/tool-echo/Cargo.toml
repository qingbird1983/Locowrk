[package]
name = "tool-echo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

# 插件产物是动态库（Windows: tool_echo.dll，见 plugins/README.md）。
[lib]
crate-type = ["cdylib"]

# 插件只依赖冻结契约层：serde_json / semver 经 plugin-api re-export。
[dependencies]
plugin-api = { workspace = true }

# manifest 版本号来自编译期环境变量 LOCOWRK_PLUGIN_VERSION
# （版本真源 = scripts/build_plugins.sh 的 stage 调用清单——本插件在其中被 stage 两次）；
# build.rs 声明 rerun-if-env-changed，变量变更即触发重编，
# 产出多版本并存所需的双 DLL。
