[package]
name = "tool-edit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

# 插件产物是动态库（Windows: tool_edit.dll，见 plugins/README.md）。
[lib]
crate-type = ["cdylib"]

# 纯用 std：字符串/行替换与严格 unified diff 都零第三方依赖；
# serde_json / semver 经 plugin-api re-export。
[dependencies]
plugin-api = { workspace = true }

# manifest 版本号来自编译期环境变量 LOCOWRK_PLUGIN_VERSION
# （scripts/build_plugins.sh 按 1.0.0 构建一次并暂存）。
