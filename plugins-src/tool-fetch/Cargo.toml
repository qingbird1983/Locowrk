[package]
name = "tool-fetch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

# 插件产物是动态库（Windows: tool_fetch.dll，见 plugins/README.md）。
[lib]
crate-type = ["cdylib"]

# serde_json / semver 经 plugin-api re-export；HTTP 用阻塞式 ureq
# （宿主把 FFI 调用放进 spawn_blocking，纪律三），rustls 免系统 TLS 依赖。
[dependencies]
plugin-api = { workspace = true }
ureq = { version = "2", default-features = false, features = ["tls"] }

# manifest 版本号来自编译期环境变量 LOCOWRK_PLUGIN_VERSION
# （scripts/build_plugins.sh 按 1.0.0 构建一次并暂存）。
