[package]
name = "locowrk-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Locowrk 桌面端（Tauri 2 组装点，DESIGN.md §10/§12）"

# tauri 2 脚手架标准三件套；lib 名加 _lib 后缀，避免与 bin 目标的
# PDB 输出文件名碰撞（create-tauri-app 惯例）
[lib]
name = "locowrk_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# 全局快捷键（阶段八⑤）：settings.json `shortcut` 按下 = 切换主窗口
tauri-plugin-global-shortcut = "2"

# 内核 crate（组装点依赖方向见 AGENTS.md 架构边界）
cordis-core = { path = "../../crates/cordis-core" }
kernel-agent = { path = "../../crates/kernel-agent" }
plugin-api = { path = "../../crates/plugin-api" }
plugin-host = { path = "../../crates/plugin-host" }
plugin-service = { path = "../../crates/plugin-service" }
session-store = { path = "../../crates/session-store" }

async-trait = "0.1"
# 三合一模型客户端（LLM.md 方案一）：openai / anthropic / ollama 统一封装
genai = "0.6"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 托盘菜单 i18n：locale = "system" 时探测系统语言（壳批次）
sys-locale = "0.3"
# time：usage 统计 5s 批量刷盘的定时器（⑩，exposure 文档 §3.3）
tokio = { version = "1", default-features = false, features = ["sync", "time"] }
# 宿主自有统计库（与 memory.sqlite3 分离——统计是宿主对插件的观测）
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = "0.3"
