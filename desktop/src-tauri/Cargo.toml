[package]
name = "locowrk-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Locowrk 桌面端（Tauri 2 组装点，DESIGN.md §10/§12）"

# tauri 2 脚手架标准三件套；lib 名加 _lib 后缀，避免与 bin 目标的
# PDB 输出文件名碰撞（create-tauri-app 惯例）
[lib]
name = "locowrk_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# 全局快捷键（阶段八⑤）：settings.json `shortcut` 按下 = 切换主窗口
tauri-plugin-global-shortcut = "2"
# ⑭ 系统通知：tool-notify desktop 通道（vtable 槽落点）+ 调度触发兜底；
# 仅 Rust 侧调用，无 JS guest / capability
tauri-plugin-notification = "2"
# ⑱ 原生目录选择（fs roots 工作区目录选择器）：pick_directory 命令 Rust
# 侧直呼（UI shell 文档 §7 规则 8），无 JS guest / capability
tauri-plugin-dialog = "2"

# 内核 crate（组装点依赖方向见 AGENTS.md 架构边界）
cordis-core = { path = "../../crates/cordis-core" }
kernel-agent = { path = "../../crates/kernel-agent" }
memory-tree = { path = "../../crates/memory-tree" }
plugin-api = { path = "../../crates/plugin-api" }
plugin-host = { path = "../../crates/plugin-host" }
plugin-service = { path = "../../crates/plugin-service" }
session-store = { path = "../../crates/session-store" }

async-trait = "0.1"
# 浏览器页签（v2.144）：lwpreview 协议的段编码/解码（url crate 传递依赖
# 已在树，声明直依赖零新增编译成本）
percent-encoding = "2"
# 多模态（批 D）：asset_put 的 base64 解码 + AssetStore 内容寻址 sha256
base64 = "0.22"
# <environment> Today 行（提示词分层设计 §4.2）：已在依赖树（tauri 传递
# 引入），声明直依赖零新增编译成本
chrono = "0.4"
sha2 = "0.10"
# ⑳ 流式 / LLM.md v3.0 SSE：resp.bytes_stream() 的 next() 需要 StreamExt
futures = "0.3"
# 自建 OpenAI 兼容客户端（LLM.md v3.0，genai 已退役）：default-tls 原由
# genai 依赖图带入，删后须显式声明；stream = bytes_stream() 的 SSE 拉流
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "default-tls",
    "stream",
] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 托盘菜单 i18n：locale = "system" 时探测系统语言（壳批次）
sys-locale = "0.3"
# time：usage 统计 5s 批量刷盘的定时器（⑩，exposure 文档 §3.3）
tokio = { version = "1", default-features = false, features = ["sync", "time"] }
# 宿主自有统计库（与 memory.sqlite3 分离——统计是宿主对插件的观测）
rusqlite = { version = "0.32", features = ["bundled"] }
# 批 E 多模态工具：屏幕截图（跨平台 GDI/DXGI 封装）+ PNG 编码（截图与
# PDF 页位图两处同吃；只开 png——读图尺寸复用 assets::validate 的头解析）
screenshots = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
# PDF 转图片：pdfium 动态库运行时绑定（库文件随包 resources/pdfium/，
# 缺库 = pdf_to_images 不进目录宁缺勿假）；image feature 缺省开，类型与
# 上面的 image 0.25 对齐
pdfium-render = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"
# codex 配置解析（批 F 导入面板：~/.codex/config.toml 纯读）
toml = "0.8"
# API Key 系统凭据库（批 C §8.4）：Windows=Credential Manager / macOS=Keychain
# / Linux=kernel keyutils（无需 libsecret 守护进程）；不可用时回落文件存储。
# 注意：target 表必须在 [dependencies] 段尾（表头之后的键都归入该表）。
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }
