[workspace]
resolver = "2"
members = [
    "crates/plugin-api",
    "crates/cordis-core",
    "crates/kernel-agent",
    "crates/plugin-host",
    "crates/plugin-service",
    "crates/session-store",
    "crates/kernel-bin",
    "plugins-src/tool-echo",
    "plugins-src/tool-shout",
    "plugins-src/tool-fs",
    "plugins-src/tool-fetch",
    "plugins-src/tool-shell",
    "plugins-src/tool-edit",
    "plugins-src/tool-git",
    "plugins-src/memory-sqlite",
    "plugins-src/tool-mcp",
    "plugins-src/tool-notify",
]
# 桌面端是独立 Cargo 包（tauri 脚手架，有自己的 lockfile/构建流程），
# 不进本 workspace，只经 path 依赖引用内核 crate（DESIGN.md §10.2）。
exclude = ["desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

# 内核核心依赖目录（DESIGN.md §8）。桌面端 tauri/reqwest 等
# 依赖在 desktop/src-tauri 脚手架（阶段五）时再补充。
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
# 图标 data URL 编码（plugin-host icon.rs，packaging.md §5.2）
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "5"
libloading = "0.8"
semver = { version = "1", features = ["serde"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
# 审计记录的时间戳（RFC 3339，middleware/audit.rs）
jiff = "0.2"
# WASM 插件加载器（DESIGN.md §5.8 第二实现）。默认特性只留 JIT 必需项：
# 不开 wasi/component-model/threads——沙箱面越小越好（§5.8 纪律）
wasmtime = { version = "34.0.2", default-features = false, features = [
    "cranelift",
    "runtime",
    "std",
] }

# 内部 crate（依赖方向严格单向，见 DESIGN.md §8 依赖图）
plugin-api = { path = "crates/plugin-api" }
cordis-core = { path = "crates/cordis-core" }
kernel-agent = { path = "crates/kernel-agent" }
plugin-host = { path = "crates/plugin-host" }
plugin-service = { path = "crates/plugin-service" }
session-store = { path = "crates/session-store" }
